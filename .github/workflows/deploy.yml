name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-poc
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository_owner }}/makitii-poc

jobs:
  build-and-push:
    name: Build & push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Lightsail
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      SHA: ${{ github.sha }}
      HOST: ${{ secrets.LIGHTSAIL_HOST }}
      SSH_USER: ${{ secrets.LIGHTSAIL_USER }}
      OWNER: ${{ github.repository_owner }}
      ACTOR: ${{ github.actor }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SSH_OPTS: -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR
    steps:
      - uses: actions/checkout@v4

      - name: Add SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.LIGHTSAIL_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Copy compose, Caddyfile and deploy script
        run: |
          scp -i ~/.ssh/id_ed25519 $SSH_OPTS \
            infra/compose/docker-compose.yml infra/compose/Caddyfile infra/scripts/deploy.sh \
            "$SSH_USER@$HOST:/opt/makitii/"
          ssh -i ~/.ssh/id_ed25519 $SSH_OPTS "$SSH_USER@$HOST" 'chmod +x /opt/makitii/deploy.sh'

      - name: Pull and restart
        run: |
          ssh -i ~/.ssh/id_ed25519 $SSH_OPTS "$SSH_USER@$HOST" \
            "SHA=$SHA OWNER=$OWNER ACTOR=$ACTOR GH_TOKEN=$GH_TOKEN bash /opt/makitii/deploy.sh"

      - name: Health check
        run: |
          ssh -i ~/.ssh/id_ed25519 $SSH_OPTS "$SSH_USER@$HOST" bash <<'REMOTE'
          set -e
          for i in $(seq 1 15); do
            if curl -fsS --max-time 5 http://localhost/api/health; then
              echo; echo "healthy on attempt $i"; exit 0
            fi
            echo "attempt $i waiting..."; sleep 3
          done
          cd /opt/makitii && docker compose ps && docker compose logs --tail=80
          exit 1
          REMOTE
